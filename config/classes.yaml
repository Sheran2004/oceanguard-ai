# OceanGuard AI - Marine Debris Detection Classes
# Class IDs must match the trained YOLO model's class order.

classes:
  0:
    id: bottle
    name: Bottle
    description: Bottle detected in the underwater tank dataset
    base_priority: medium
    is_anomaly: false

  1:
    id: can
    name: Can
    description: Can detected in the underwater tank dataset
    base_priority: medium
    is_anomaly: false

  2:
    id: chain
    name: Chain
    description: Chain or linked metal structure
    base_priority: medium
    is_anomaly: false

  3:
    id: drink_carton
    name: Drink Carton
    description: Drink carton detected underwater
    base_priority: medium
    is_anomaly: false

  4:
    id: hook
    name: Hook
    description: Hook-shaped underwater object
    base_priority: high
    is_anomaly: false

  5:
    id: propeller
    name: Propeller
    description: Propeller detected underwater
    base_priority: high
    is_anomaly: false

  6:
    id: shampoo_bottle
    name: Shampoo Bottle
    description: Shampoo bottle detected underwater
    base_priority: medium
    is_anomaly: false

  7:
    id: standing_bottle
    name: Standing Bottle
    description: Standing bottle detected underwater
    base_priority: medium
    is_anomaly: false

  8:
    id: tire
    name: Tire
    description: Tire detected underwater
    base_priority: high
    is_anomaly: false

  9:
    id: valve
    name: Valve
    description: Valve or mechanical component detected underwater
    base_priority: high
    is_anomaly: false

  10:
    id: wall
    name: Wall
    description: Wall or tank structure present in the image
    base_priority: low
    is_anomaly: false

priority_rules:
  high_confidence_threshold: 0.85
  review_confidence_threshold: 0.40
  size_high_area_ratio: 0.10
  size_medium_area_ratio: 0.03
  cluster_nearby_distance_px: 80
  cluster_nearby_count: 3