version: "3.9"

# OceanGuard AI — production docker-compose
# Usage:
#   docker compose --profile production up -d
#   docker compose --profile dev up        (development with hot-reload)
#
# This file pulls in PostgreSQL, the backend (gunicorn), the frontend (nginx
# serving the built static bundle), and a reverse-proxy/load-balancer.

services:
  # ===================== Development services =====================
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: oceanguard-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/oceanguard.db
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
      - ./reports:/app/reports

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: oceanguard-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: /api
    volumes:
      - ./frontend:/app

  # ===================== Production services =====================

  postgres:
    profiles: ["production"]
    image: postgres:16-alpine
    container_name: oceanguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oceaguard
      POSTGRES_USER: oceanguard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanguard -d oceaguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["production"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://oceanguard:${DB_PASSWORD}@postgres:5432/oceaguard
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    profiles: ["production"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: oceanguard-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    profiles: ["production"]
    image: nginx:1.27-alpine
    container_name: oceanguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:
  reports: